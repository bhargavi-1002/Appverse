<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AppVerse logo">
  <defs>
    <linearGradient id="avTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1f47" />
      <stop offset="55%" stop-color="#0d1026" />
      <stop offset="100%" stop-color="#070912" />
    </linearGradient>
    <linearGradient id="avMark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="avSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="avGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#avTile)" />
  <rect width="512" height="512" rx="116" fill="url(#avSheen)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" />

  <g filter="url(#avGlow)">
    <path d="M132 384 L256 138 L380 384" fill="none" stroke="url(#avMark)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M196 312 H316" fill="none" stroke="url(#avMark)" stroke-width="36" stroke-linecap="round" />
  </g>

  <circle cx="380" cy="150" r="19" fill="#22d3ee" />
  <circle cx="380" cy="150" r="34" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="5" />
</svg>
