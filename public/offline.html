<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · AppVerse</title>
    <meta name="theme-color" content="#06070f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #06070f;
        --surface: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.1);
        --text: #eceefb;
        --muted: #9aa1c4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .card {
        max-width: 30rem;
        padding: 2.5rem 1.75rem;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--surface);
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.95rem;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 1.25rem;
        border-radius: 12px;
        background: linear-gradient(135deg, #7c5cff, #4f46e5);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a.secondary {
        display: inline-block;
        margin-top: 0.75rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="" width="64" height="64" />
      <h1>You are offline</h1>
      <p>
        The AppVerse catalogue has not been cached on this device yet. Reconnect to load it — or
        install AppVerse so the catalogue stays available without a connection.
      </p>
      <a class="button" href="/">Try again</a>
      <br />
      <a class="secondary" href="/install">How to install AppVerse</a>
    </div>
  </body>
</html>
